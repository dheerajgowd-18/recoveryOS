[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recoveryos"
version = "2.0.0"
description = "Autonomous AI revenue recovery agent for Razorpay AI Buildathon 2026"
readme = "PROJECT_EXPLANATION.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.2",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "anyio>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*",
    "audit*",
    "backend*",
    "dashboard*",
    "domain*",
    "evaluation*",
    "execution*",
    "governor*",
    "ingestion*",
    "intelligence*",
    "planner*",
    "policy*",
    "rag*",
    "scheduler*",
    "simulator*",
]
exclude = [
    "tests*",
    "scripts*",
    "reports*",
    "config*",
]

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
markers = [
    "asyncio: mark test as asyncio",
]
